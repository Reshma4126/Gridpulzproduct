<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GRIDPULZ | Authentication Gateway</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Michroma&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#35343a",
                        "on-surface-variant": "#c3caac",
                        "surface-dim": "#131318",
                        "surface-container-highest": "#35343a",
                        "primary-fixed": "#b8f600",
                        "primary": "#ffffff",
                        "on-background": "#e4e1e9",
                        "on-surface": "#e4e1e9",
                        "outline": "#8d9479",
                        "background": "#131318",
                        "error": "#ffb4ab",
                        "surface": "#131318",
                        "surface-container": "#1f1f25",
                        "primary-container": "#b8f600",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(31, 31, 37, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dot-grid {
            background-image: radial-gradient(rgba(184, 246, 0, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .michroma-heading {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#0A0A0F] text-on-surface font-body min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- background decor -->
    <div class="dot-grid absolute inset-0 opacity-40 z-0"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-[#BFFF00] opacity-[0.03] blur-[150px] rounded-full pointer-events-none z-0"></div>

    <div class="glass-panel w-full max-w-md p-10 rounded-2xl border border-outline/20 relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)] animate-fade">
        <div class="flex justify-center mb-8">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <img src="gridpulz_logo.png" alt="GridPulz" class="h-32 mix-blend-lighten">
            </a>
        </div>
        <h2 class="michroma-heading text-xl text-center mb-8 text-white">System Access</h2>

        <!-- Role Toggle -->
        <div class="flex bg-surface-container-highest p-1 rounded-lg mb-8 shadow-inner">
            <button id="tab-operator" type="button" class="flex-1 py-3 font-headline font-bold uppercase tracking-widest text-[10px] rounded bg-[#BFFF00] text-[#161e00] transition-colors shadow-sm cursor-pointer pointer-events-auto relative z-20">Station Operator</button>
            <button id="tab-user" type="button" class="flex-1 py-3 font-headline font-bold uppercase tracking-widest text-[10px] rounded text-on-surface-variant hover:text-white transition-colors cursor-pointer pointer-events-auto relative z-20">EV Driver</button>
        </div>

        <form id="login-form">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Network Credentials (Email)</label>
                    <input id="email-input" type="email" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="operator@gridpulz.app">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant">Security Key (Password)</label>
                        <a href="#" class="text-[10px] font-body uppercase tracking-widest text-[#BFFF00] hover:underline">Reset Key?</a>
                    </div>
                    <input id="password-input" type="password" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-[#BFFF00] text-[#161e00] font-headline font-bold uppercase tracking-widest py-4 rounded hover:bg-[#BFFF00]/90 hover:shadow-[0_0_15px_rgba(191,255,0,0.3)] transition-all flex items-center justify-center gap-2 mt-6 active:scale-95 group">
                    Authenticate <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">login</span>
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-outline/20">
            <div class="text-center font-body uppercase tracking-widest text-[10px] text-on-surface-variant mb-4">NEW DETECTED IDENTITIES</div>
            <div class="flex flex-col gap-3">
                <a href="signup-operator.html" class="w-full border border-[#BFFF00]/30 text-[#BFFF00] font-headline font-bold uppercase tracking-widest text-[10px] py-4 rounded text-center hover:bg-[#BFFF00]/10 transition-colors">Register Station Node</a>
                <a href="signup-user.html" class="w-full border border-white/10 text-white font-headline font-bold uppercase tracking-widest text-[10px] py-4 rounded text-center hover:bg-white/5 transition-colors">Sign Up as EV Driver</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jytyvsytvppkkmadnjyo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dHl2c3l0dnBwa2ttYWRuanlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4OTc5NTcsImV4cCI6MjA5MTQ3Mzk1N30.f89QHiMr5p9aFg5WuNZ6POVDHXYx1HCIOSq42hE-ZVA';
        
        // Use a different variable name to avoid conflicts
        const loginSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRole = 'operator';

        function switchRole(role) {
            console.log('switchRole called with role:', role);
            currentRole = role;
            const opBtn = document.getElementById('tab-operator');
            const usrBtn = document.getElementById('tab-user');
            const emailInput = document.getElementById('email-input');
            const activeClass = "flex-1 py-3 font-headline font-bold uppercase tracking-widest text-[10px] rounded bg-[#BFFF00] text-[#161e00] transition-colors shadow-sm cursor-pointer pointer-events-auto relative z-20";
            const inactiveClass = "flex-1 py-3 font-headline font-bold uppercase tracking-widest text-[10px] rounded text-on-surface-variant hover:text-white transition-colors cursor-pointer pointer-events-auto relative z-20";
            if (role === 'operator') {
                opBtn.className = activeClass;
                usrBtn.className = inactiveClass;
                emailInput.placeholder = 'operator@gridpulz.app';
                console.log('Switched to operator mode');
            } else {
                usrBtn.className = activeClass;
                opBtn.className = inactiveClass;
                emailInput.placeholder = 'driver@example.com';
                console.log('Switched to user mode');
            }
        }

        function showError(msg, isHint = false) {
            let el = document.getElementById('login-error');
            if (!el) {
                el = document.createElement('div');
                el.id = 'login-error';
                const form = document.getElementById('login-form');
                form.appendChild(el);
            }
            el.className = isHint 
                ? 'text-primary-fixed text-[10px] font-mono text-center mt-4 p-3 bg-primary-fixed/5 border border-primary-fixed/20 rounded-lg animate-pulse'
                : 'text-red-400 text-xs font-mono text-center mt-4 p-3 bg-red-400/10 border border-red-400/30 rounded-lg';
            
            el.innerHTML = (isHint ? '💡 ' : '⚠ ') + msg;
            el.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Clear previous errors
            const prevError = document.getElementById('login-error');
            if (prevError) prevError.style.display = 'none';

            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            // EV Driver — use Supabase Auth
            if (currentRole === 'user') {
                console.log('Attempting EV Driver login with Supabase...');
                
                const { data, error } = await loginSupabase.auth.signInWithPassword({ email, password });
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Authenticate <span class="material-symbols-outlined text-sm">login</span>';
                
                if (error) { 
                    console.error('Supabase auth error:', error);
                    
                    if (error.message.includes('Invalid login credentials')) {
                        showError('Invalid credentials. Are you sure you are registered as an EV Driver?');
                        showError('Try switching to "Station Operator" if you registered your infrastructure.', true);
                    } else if (error.message.includes('Email not confirmed')) {
                        showError('Email not confirmed. Please check your inbox for the activation link.');
                    } else {
                        showError(error.message);
                    }
                    return; 
                }
                
                console.log('Login successful!');
                sessionStorage.setItem('isAuthenticated', 'true');
                sessionStorage.setItem('userRole', 'user');
                // Ensure localStorage is cleared of conflicting auth data if any
                localStorage.removeItem('token'); 
                window.location.href = 'user-dashboard.html';
                return;
            }

            // Operator — use existing Express API
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: 'operator' })
                });
                const result = await response.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Authenticate <span class="material-symbols-outlined text-sm">login</span>';
                
                if (response.ok) {
                    sessionStorage.setItem('token', result.token);
                    sessionStorage.setItem('userRole', 'operator');
                    sessionStorage.setItem('isAuthenticated', 'true');
                    // Sync with localStorage if needed by other legacy pages, but prioritize session
                    localStorage.setItem('token', result.token);
                    window.location.href = 'dashboard.html';
                } else {
                    if (result.error.includes('Invalid credentials') || result.error.includes('wrong role')) {
                        showError('Access Denied. Identity not found in Operator registry.');
                        showError('If you are an EV Driver, please select the "EV Driver" tab above.', true);
                    } else {
                        showError(result.error);
                    }
                }
            } catch (err) {
                submitBtn.disabled = false;
                showError('Network connectivity issue. Please verify your connection.');
            }
        }

        // Attach event listeners after DOM loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, attaching event listeners');
            
            const opBtn = document.getElementById('tab-operator');
            const usrBtn = document.getElementById('tab-user');
            
            console.log('Operator button found:', opBtn);
            console.log('User button found:', usrBtn);
            
            opBtn.addEventListener('click', function(e) {
                console.log('Operator button clicked!', e);
                switchRole('operator');
            });
            
            usrBtn.addEventListener('click', function(e) {
                console.log('User button clicked!', e);
                switchRole('user');
            });
            
            document.getElementById('login-form').addEventListener('submit', handleLogin);
            
            // Test click events
            console.log('Event listeners attached');
        });
    </script>
</body>
</html>
