<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GRIDPULZ | Operator Registration</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Michroma&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#35343a",
                        "on-surface-variant": "#c3caac",
                        "surface-dim": "#131318",
                        "surface-container-highest": "#35343a",
                        "primary-fixed": "#b8f600",
                        "primary": "#ffffff",
                        "on-background": "#e4e1e9",
                        "on-surface": "#e4e1e9",
                        "outline": "#8d9479",
                        "background": "#131318",
                        "error": "#ffb4ab",
                        "surface": "#131318",
                        "surface-container": "#1f1f25",
                        "primary-container": "#b8f600",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(31, 31, 37, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dot-grid {
            background-image: radial-gradient(rgba(184, 246, 0, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .michroma-heading {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#0A0A0F] text-on-surface font-body min-h-screen py-12 flex items-center justify-center relative overflow-x-hidden">
    <!-- background decor -->
    <div class="dot-grid absolute inset-0 opacity-40 z-0 pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1000px] h-[1000px] bg-[#BFFF00] opacity-[0.02] blur-[150px] rounded-full pointer-events-none z-0"></div>

    <div class="glass-panel w-full max-w-2xl p-10 rounded-2xl border border-[#BFFF00]/30 relative z-10 shadow-[0_0_50px_rgba(191,255,0,0.1)] animate-fade">
        <div class="flex justify-center mb-8">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <img src="gridpulz_logo.png" alt="GridPulz" class="h-32 mix-blend-lighten">
            </a>
        </div>
        <h2 class="michroma-heading text-2xl text-center mb-2 text-[#BFFF00]">Deploy Station Node</h2>
        <p class="text-center font-body text-xs text-on-surface-variant mb-10">Join the intelligent EV grid. Register your charging infrastructure.</p>

        <form id="signup-operator" onsubmit="handleRegistration(event)">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Column 1: Identity -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Company / Station Name *</label>
                        <input type="text" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="e.g. Apex Charging LLC">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Administrator Email *</label>
                        <input type="email" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="admin@apexcharge.com">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Access Password *</label>
                        <input type="password" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Primary Location (City) *</label>
                        <input type="text" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="e.g. Austin, TX">
                    </div>
                </div>

                <!-- Column 2: Grid Params -->
                <div class="space-y-4 bg-[#131318] p-4 rounded border border-outline/10">
                    <div class="mb-4 pb-2 border-b border-outline/10 font-headline font-bold text-xs uppercase tracking-widest text-white">Grid Parameters</div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Number of Charging Points *</label>
                        <input type="number" min="1" required class="w-full bg-[#0A0A0F] border border-outline/30 rounded px-4 py-3 text-[#BFFF00] font-mono focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors text-sm" placeholder="e.g. 12">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Total Power Capacity (kW) *</label>
                        <input type="number" min="10" required class="w-full bg-[#0A0A0F] border border-outline/30 rounded px-4 py-3 text-[#BFFF00] font-mono focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors text-sm" placeholder="e.g. 350">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Connector Types</label>
                        <select class="w-full bg-[#0A0A0F] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm">
                            <option value="ccs">CCS / Level 3 Fast</option>
                            <option value="chademo">CHAdeMO</option>
                            <option value="type2">Type 2 / Level 2 AC</option>
                            <option value="mixed">Mixed Support Stack</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#BFFF00] text-[#161e00] font-headline font-bold uppercase tracking-widest py-4 rounded hover:bg-[#BFFF00]/90 hover:shadow-[0_0_20px_rgba(191,255,0,0.4)] transition-all flex items-center justify-center gap-2 mt-4 active:scale-95 group">
                Establish Node <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">add_task</span>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-outline/20 text-center">
            <a href="login.html" class="font-body text-xs text-on-surface-variant hover:text-white transition-colors">Already have a station registered? <span class="text-[#BFFF00] uppercase tracking-widest font-bold ml-1">Authenticate Here</span></a>
        </div>
    </div>

    <script>
        async function handleRegistration(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input, select');
            const data = {
                companyName: inputs[0].value,
                email: inputs[1].value,
                password: inputs[2].value,
                location: inputs[3].value,
                chargingPoints: parseInt(inputs[4].value),
                totalPower: parseInt(inputs[5].value),
                connectorTypes: inputs[6].value
            };
            
            try {
                const response = await fetch('/api/auth/register/operator', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (response.ok) {
                    sessionStorage.setItem('token', result.token);
                    sessionStorage.setItem('userRole', result.role);
                    sessionStorage.setItem('isAuthenticated', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Registration failed: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Registration failed. Please try again.');
            }
        }
    </script>
</body>
</html>
