<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GRIDPULZ | Driver Registration</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Michroma&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#35343a",
                        "on-surface-variant": "#c3caac",
                        "surface-dim": "#131318",
                        "surface-container-highest": "#35343a",
                        "primary-fixed": "#b8f600",
                        "primary": "#ffffff",
                        "on-background": "#e4e1e9",
                        "on-surface": "#e4e1e9",
                        "outline": "#8d9479",
                        "background": "#131318",
                        "error": "#ffb4ab",
                        "surface": "#131318",
                        "surface-container": "#1f1f25",
                        "primary-container": "#b8f600",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(31, 31, 37, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dot-grid {
            background-image: radial-gradient(rgba(184, 246, 0, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .michroma-heading {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#0A0A0F] text-on-surface font-body min-h-screen py-12 flex items-center justify-center relative overflow-x-hidden">
    <!-- background decor -->
    <div class="dot-grid absolute inset-0 opacity-40 z-0 pointer-events-none"></div>

    <div class="glass-panel w-full max-w-md p-10 rounded-2xl border border-white/10 relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)] animate-fade">
        <div class="flex justify-center mb-8">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <img src="gridpulz_logo.png" alt="GridPulz" class="h-32 mix-blend-lighten opacity-80">
            </a>
        </div>
        <h2 class="michroma-heading text-xl text-center mb-2 text-white">Initialize Driver Identity</h2>
        <p class="text-center font-body text-xs text-on-surface-variant mb-10">Access predictive intelligence for your charging sessions.</p>

        <form id="signup-user">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Full Name *</label>
                    <input id="fullName" type="text" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="e.g. Jane Doe">
                </div>
                <div>
                    <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Driver Email *</label>
                    <input id="email" type="email" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="jane@example.com">
                </div>
                <div>
                    <label class="block text-[10px] font-body uppercase tracking-widest text-on-surface-variant mb-2">Access Password *</label>
                    <input id="password" type="password" required class="w-full bg-[#131318] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] focus:ring-1 focus:ring-[#BFFF00] transition-colors font-body text-sm" placeholder="••••••••">
                </div>
                
            </div>

            <button type="submit" class="w-full bg-white text-[#0A0A0F] font-headline font-bold uppercase tracking-widest py-4 rounded hover:bg-gray-200 transition-all flex items-center justify-center gap-2 mt-8 active:scale-95 group">
                Create Identity <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">bolt</span>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-outline/20 text-center">
            <a href="login.html" class="font-body text-xs text-on-surface-variant hover:text-white transition-colors">Already registered? <span class="text-white uppercase tracking-widest font-bold ml-1">Authenticate Here</span></a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jytyvsytvppkkmadnjyo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dHl2c3l0dnBwa2ttYWRuanlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4OTc5NTcsImV4cCI6MjA5MTQ3Mzk1N30.f89QHiMr5p9aFg5WuNZ6POVDHXYx1HCIOSq42hE-ZVA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const btn = document.querySelector('button[type="submit"]');
        const btnText = btn.innerHTML;

        function setLoading(loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="material-symbols-outlined text-sm">progress_activity</span> Processing...'
                : btnText;
        }

        function showError(msg) {
            let el = document.getElementById('error-msg');
            if (!el) {
                el = document.createElement('p');
                el.id = 'error-msg';
                el.className = 'text-red-400 text-xs font-mono text-center mt-4 p-3 bg-red-400/10 border border-red-400/30 rounded';
                btn.parentNode.insertBefore(el, btn.nextSibling);
            }
            el.textContent = '⚠ ' + msg;
        }

        async function handleRegistration(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!fullName || !email || !password) {
                showError('All fields are required.');
                return;
            }

            setLoading(true);

            // Step 1: Sign up with Supabase Auth
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName, role: 'user' } }
            });

            if (error) {
                setLoading(false);
                showError(error.message);
                return;
            }

            // Step 2: Insert profile row using new schema (user_id column)
            if (data.user) {
                const { error: profileError } = await supabase
                    .from('user_profiles')
                    .insert({ id: data.user.id, full_name: fullName });
                if (profileError) console.warn('Profile insert:', profileError.message);
            }

            // Step 3: Redirect if session exists (email confirmation OFF)
            // or show confirmation message (email confirmation ON)
            if (data.session) {
                sessionStorage.setItem('isAuthenticated', 'true');
                sessionStorage.setItem('userRole', 'user');
                window.location.href = 'user-dashboard.html';
            } else {
                setLoading(false);
                document.getElementById('signup-user').innerHTML = `
                    <div class="text-center py-8">
                        <span class="material-symbols-outlined text-[#BFFF00] text-5xl mb-4 block">mark_email_read</span>
                        <h3 class="michroma-heading text-lg text-white mb-3">Check Your Email</h3>
                        <p class="text-on-surface-variant text-sm leading-relaxed mb-6">
                            A confirmation link was sent to <span class="text-[#BFFF00] font-bold">${email}</span>.<br>
                            Click it to activate your account, then log in.
                        </p>
                        <a href="login.html" class="inline-block bg-[#BFFF00] text-[#0A0A0F] font-headline font-bold uppercase tracking-widest px-8 py-3 rounded hover:opacity-90 transition-all">
                            Go to Login
                        </a>
                    </div>
                `;
            }
        }

        // Attach event listener after DOM is ready
        document.getElementById('signup-user').addEventListener('submit', handleRegistration);
    </script>
</body>
</html>
