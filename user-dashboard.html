<!DOCTYPE html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jytyvsytvppkkmadnjyo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dHl2c3l0dnBwa2ttYWRuanlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4OTc5NTcsImV4cCI6MjA5MTQ3Mzk1N30.f89QHiMr5p9aFg5WuNZ6POVDHXYx1HCIOSq42hE-ZVA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GridPulz | Telemetry Calibration</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&family=Michroma&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#35343a",
                        "on-surface-variant": "#c3caac",
                        "surface-dim": "#131318",
                        "surface-container-highest": "#35343a",
                        "primary-fixed": "#b8f600",
                        "primary": "#ffffff",
                        "on-background": "#e4e1e9",
                        "on-surface": "#e4e1e9",
                        "outline": "#8d9479",
                        "background": "#131318",
                        "error": "#ffb4ab",
                        "surface": "#131318",
                        "surface-container": "#1f1f25",
                        "primary-container": "#b8f600",
                        "outline-variant": "#434933",
                        "secondary_text": "#888888",
                        "surface-container-low": "#1b1b20",
                        "surface-container-lowest": "#0e0e13"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        .michroma-heading {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        @keyframes dashboardFadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        main {
            animation: dashboardFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hover-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-card:hover {
            transform: translateY(-4px);
            border-color: rgba(191,255,0,0.5);
            box-shadow: 0 8px 30px rgba(191,255,0,0.15);
            background-color: #1a1a1a;
        }
    </style>
</head>

<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-[#161e00]">

    <!-- Top Navigation -->
<nav class="fixed top-0 w-full bg-[#131313]/90 backdrop-blur-md border-b border-outline-variant/30 z-50">
    <div class="flex justify-between items-center w-full px-8 py-5 max-w-[1440px] mx-auto">
        <div class="flex items-center">
            <a href="index.html" class="hover:opacity-80 transition-opacity"><img alt="GridPulz Logo" class="h-32 w-auto mix-blend-lighten" src="gridpulz_logo.png"/></a>
            <span class="px-2 py-0.5 bg-white/10 text-white text-[10px] font-headline font-bold uppercase tracking-widest rounded-sm ml-4 hidden sm:block">Data Collection</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden md:flex flex-col text-right">
                <span id="profile-name" class="text-xs font-bold text-white uppercase tracking-widest"></span>
                <span class="text-[10px] font-mono text-secondary_text uppercase">Telemetry Calibration</span>
            </div>
            <button onclick="logout()" class="p-2 bg-surface-container-low hover:bg-error/20 hover:text-error rounded border border-outline-variant/30 transition-colors group">
                <span class="material-symbols-outlined text-[20px] group-hover:block hidden">logout</span>
                <span class="material-symbols-outlined text-[20px] group-hover:hidden text-white">person</span>
            </button>
        </div>
    </div>
</nav>

<main class="pt-48 pb-32 px-6 max-w-3xl mx-auto space-y-6">
        <div class="mb-10 flex flex-col justify-between items-start border-l-4 border-[#BFFF00] pl-6 py-2">
            <h1 class="text-4xl md:text-5xl michroma-heading text-white tracking-tighter leading-[1.05] mt-2 mb-2">TELEMETRY CALIBRATION</h1>
            <p class="font-mono text-sm text-secondary_text">Update your vehicle and usage vectors for optimal routing & demand prediction.</p>
        </div>

        <form id="telemetry-form" class="space-y-8 bg-surface-container-low p-8 border border-outline-variant/10 rounded-sm hover-card">
            
            <!-- Vehicle Info -->
            <section>
                <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-2">
                    <span class="material-symbols-outlined text-[#BFFF00]">directions_car</span>
                    <h2 class="michroma-heading text-sm text-white">Core Vehicle Profile</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-[#BFFF00] opacity-80 mb-2">Vehicle Type *</label>
                        <select id="vehicleType" required class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] transition-colors text-sm">
                            <option value="4W">4W (Car)</option>
                            <option value="2W">2W (Bike/Scooter)</option>
                            <option value="3W">3W (Auto/Rickshaw)</option>
                            <option value="Commercial EV">Commercial EV</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-secondary_text mb-2">Battery Capacity (kWh) (Optional)</label>
                        <input id="batteryCapacity" type="number" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-[#BFFF00] transition-colors text-sm font-mono focus:border-[#BFFF00]" placeholder="e.g. 75">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-[#BFFF00] opacity-80 mb-2">Preferred Charging Type *</label>
                        <select id="preferredChargingType" required class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-[#BFFF00] focus:outline-none focus:border-[#BFFF00] transition-colors text-sm">
                            <option value="Fast">Fast Charging</option>
                            <option value="Normal">Normal Charging</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-secondary_text mb-2">Current Charge (%)</label>
                        <input id="currentCharge" type="number" min="0" max="100" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-[#BFFF00] transition-colors text-sm font-mono focus:border-[#BFFF00]" placeholder="e.g. 60">
                    </div>
                </div>
            </section>

            <!-- Location -->
            <section>
                <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-2">
                    <span class="material-symbols-outlined text-[#BFFF00]">my_location</span>
                    <h2 class="michroma-heading text-sm text-white">Location Intelligence</h2>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-[#BFFF00] opacity-80 mb-2">Current Location (City/ZIP)</label>
                        <input id="currentLocation" type="text" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] transition-colors text-sm" placeholder="e.g. Austin, TX">
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-secondary_text mb-2">Frequently Used Locations</label>
                        <input id="frequentLocations" type="text" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] transition-colors text-sm" placeholder="e.g. Home, Work, Gym">
                    </div>
                </div>
            </section>

            <!-- Usage Prefs -->
            <section>
                <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-2">
                    <span class="material-symbols-outlined text-[#BFFF00]">insights</span>
                    <h2 class="michroma-heading text-sm text-white">Usage Patterns</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-[#BFFF00] opacity-80 mb-2">Preferred Charging Time</label>
                        <select id="preferredChargingTime" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] transition-colors text-sm">
                            <option value="Morning">Morning</option>
                            <option value="Evening">Evening</option>
                            <option value="Night">Night</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-body uppercase tracking-widest text-[#BFFF00] opacity-80 mb-2">Typical Usage</label>
                        <select id="typicalUsage" class="w-full bg-[#111] border border-outline/30 rounded px-4 py-3 text-white focus:outline-none focus:border-[#BFFF00] transition-colors text-sm">
                            <option value="Daily">Daily Commute</option>
                            <option value="Occasional">Occasional Use</option>
                            <option value="Long Trips">Long Trips</option>
                        </select>
                    </div>
                </div>
            </section>

            <button type="submit" class="w-full bg-[#BFFF00] text-[#131318] font-headline font-bold uppercase tracking-widest py-4 rounded hover:opacity-90 transition-all flex items-center justify-center gap-2 active:scale-95 group">
                SYNC CALIBRATION DATA <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">sync</span>
            </button>
            <p id="success-msg" class="text-[#BFFF00] text-center font-mono text-xs hidden mt-4">✓ Profile Successfully Updated.</p>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            const user = session.user;

            // Show name from metadata or email fallback
            const fullName = user.user_metadata?.full_name || user.email;
            document.getElementById('profile-name').textContent = fullName;

            // Load existing profile from Supabase
            const { data: profile } = await supabase
                .from('user_profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                if (profile.vehicle_type) document.getElementById('vehicleType').value = profile.vehicle_type;
                if (profile.battery_capacity) document.getElementById('batteryCapacity').value = profile.battery_capacity;
                if (profile.preferred_charging_type) document.getElementById('preferredChargingType').value = profile.preferred_charging_type;
                if (profile.current_charge) document.getElementById('currentCharge').value = profile.current_charge;
                if (profile.current_location) document.getElementById('currentLocation').value = profile.current_location;
                if (profile.frequent_locations) document.getElementById('frequentLocations').value = profile.frequent_locations;
                if (profile.preferred_charging_time) document.getElementById('preferredChargingTime').value = profile.preferred_charging_time;
                if (profile.typical_usage) document.getElementById('typicalUsage').value = profile.typical_usage;
            }
        });

        // Form Submission
        document.getElementById('telemetry-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            const payload = {
                id: session.user.id,
                full_name: session.user.user_metadata?.full_name || '',
                vehicle_type: document.getElementById('vehicleType').value,
                battery_capacity: document.getElementById('batteryCapacity').value ? parseFloat(document.getElementById('batteryCapacity').value) : null,
                preferred_charging_type: document.getElementById('preferredChargingType').value,
                current_charge: document.getElementById('currentCharge').value ? parseFloat(document.getElementById('currentCharge').value) : null,
                current_location: document.getElementById('currentLocation').value || null,
                frequent_locations: document.getElementById('frequentLocations').value || null,
                preferred_charging_time: document.getElementById('preferredChargingTime').value || null,
                typical_usage: document.getElementById('typicalUsage').value || null,
                updated_at: new Date().toISOString()
            };

            const { error } = await supabase
                .from('user_profiles')
                .upsert(payload, { onConflict: 'id' });

            const msg = document.getElementById('success-msg');
            if (!error) {
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } else {
                alert('Failed to update profile: ' + error.message);
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            sessionStorage.removeItem('isAuthenticated');
            sessionStorage.removeItem('userRole');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
